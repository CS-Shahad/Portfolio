<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050b"/>
      <stop offset="55%" stop-color="#090914"/>
      <stop offset="100%" stop-color="#0c0c1a"/>
    </linearGradient>

    <linearGradient id="streakA" x1="0%" y1="0%" x2="100%" y2="100%">
      <animate attributeName="x1" values="0%;-60%;0%;60%;0%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;40%;100%;160%;100%" dur="9s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#7730E8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7730E8" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#00C8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00C8E0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="streakB" x1="0%" y1="100%" x2="100%" y2="0%">
      <animate attributeName="x1" values="0%;70%;0%;-70%;0%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;170%;100%;30%;100%" dur="12s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#E040FB" stop-opacity="0"/>
      <stop offset="40%" stop-color="#E040FB" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#7730E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00C8E0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="streakC" x1="0%" y1="0%" x2="100%" y2="0%">
      <animate attributeName="x1" values="0%;-80%;0%;80%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;20%;100%;180%;100%" dur="7s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#00C8E0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C8E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7730E8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowTight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgBase)"/>

  <g filter="url(#glowSoft)" opacity="0.85">
    <path d="M -100 160 C 260 140, 480 340, 760 300 S 1260 90, 1560 260 S 1880 520, 2050 480"
          fill="none" stroke="url(#streakA)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -100 200 C 280 190, 500 380, 790 340 S 1280 130, 1580 300 S 1880 560, 2050 520"
          fill="none" stroke="url(#streakA)" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g filter="url(#glowSoft)" opacity="0.9">
    <path d="M -100 1000 C 220 880, 420 940, 680 860 S 1180 640, 1460 760 S 1820 980, 2050 900"
          fill="none" stroke="url(#streakB)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -100 1040 C 240 920, 440 980, 700 900 S 1200 680, 1480 800 S 1820 1020, 2050 940"
          fill="none" stroke="url(#streakB)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <path d="M -100 960 C 200 840, 400 900, 660 820 S 1160 600, 1440 720 S 1820 940, 2050 860"
          fill="none" stroke="url(#streakB)" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  </g>

  <g filter="url(#glowSoft)" opacity="0.55">
    <path d="M 300 -50 C 500 250, 700 450, 1050 620 S 1500 780, 1750 1000"
          fill="none" stroke="url(#streakC)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g filter="url(#glowSoft)" opacity="0.4">
    <path d="M -100 500 C 350 460, 650 560, 1000 500 S 1600 420, 2050 520"
          fill="none" stroke="url(#streakC)" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <g filter="url(#glowTight)">
    <circle cx="120" cy="880" r="3" fill="#00C8E0"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="920" r="2" fill="#7730E8"><animate attributeName="opacity" values="0.08;1;0.08" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="840" r="2.5" fill="#ffffff"><animate attributeName="opacity" values="0.08;1;0.08" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="780" r="2" fill="#00C8E0"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="860" r="3" fill="#E040FB"><animate attributeName="opacity" values="0.08;1;0.08" dur="4.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="900" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.08;1;0.08" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="760" r="2.5" fill="#7730E8"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="820" r="2" fill="#00C8E0"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.3s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1250" cy="900" r="3" fill="#E040FB"><animate attributeName="opacity" values="0.08;1;0.08" dur="4.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="760" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.08;1;0.08" dur="2.9s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1560" cy="700" r="2.5" fill="#00C8E0"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.7s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1700" cy="760" r="2" fill="#7730E8"><animate attributeName="opacity" values="0.08;1;0.08" dur="4s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="1820" cy="680" r="3" fill="#ffffff"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>

    <circle cx="380" cy="260" r="2" fill="#7730E8"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="200" r="1.5" fill="#00C8E0"><animate attributeName="opacity" values="0.08;1;0.08" dur="4.3s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="300" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.08;1;0.08" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="180" r="2.5" fill="#00C8E0"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.8s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1450" cy="260" r="2" fill="#7730E8"><animate attributeName="opacity" values="0.08;1;0.08" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1680" cy="220" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.08;1;0.08" dur="4.5s" begin="1s" repeatCount="indefinite"/></circle>

    <circle cx="960" cy="580" r="1.5" fill="#00C8E0" opacity="0.7"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="560" r="1.5" fill="#7730E8" opacity="0.6"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="4.1s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="600" r="1.5" fill="#ffffff" opacity="0.6"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <g filter="url(#glowSoft)" opacity="0.7">
    <circle cx="150" cy="900" r="10" fill="url(#dotGlow)"><animate attributeName="r" values="8;12;8" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1830" cy="700" r="12" fill="url(#dotGlow)"><animate attributeName="r" values="10;14;10" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="200" r="8" fill="url(#dotGlow)"><animate attributeName="r" values="6;10;6" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
