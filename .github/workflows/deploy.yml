name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_step.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
          # اختصار ذكي: هذا السطر يفعل الكاش تلقائياً وبشكل رسمي ومضمون بدون خطوات إضافية!
          run_install: false 

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Portfolio Project
        # تم تصحيح الأمر ليعمل مباشرة بالاعتماد على الفلتر الخاص بالـ Monorepo
        run: pnpm --filter @workspace/portfolio run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/portfolio/dist' 

      - name: Deploy to GitHub Pages
        id: deployment_step
        uses: actions/deploy-pages@v4