name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main # أو master حسب اسم الفرع الرئيسي عندك

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11 # يتوافق مع نسخة pnpm التي تستخدمينها

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env: STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Portfolio Project
        # هنا نقوم بتمرير المتغيرات التي يحتاجها الـ Vite أثناء البناء والتشغيل
        run: |
          PORT=3000 BASE_PATH=/${{ github.event.repository.name }}/ pnpm --filter @workspace/portfolio run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # تنبيه: تأكدي من مسار مجلد المخرجات (dist) بعد البناء، غالباً يكون في هذا المسار:
            # path: './artifacts/portfolio/src' >> من عندي، جربيها لو احتجتي 
            path: './artifacts/portfolio/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4