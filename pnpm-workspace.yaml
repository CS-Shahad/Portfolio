# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# pnpm only installs package versions that have been published for at least
# 1 day (1440 minutes). Malicious npm releases are usually discovered and
# pulled within hours, so this delay is a strong safety buffer.
#
# Do not disable this setting. If you urgently need a newer version (e.g. a
# security fix), add it to a `minimumReleaseAgeExclude:` list temporarily and
# remove the exclusion once the 1-day window has passed.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  framer-motion: ^12.23.24
  react: 19.1.0
  react-dom: 19.1.0
  tailwindcss: ^4.1.14
  vite: ^7.3.0

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
